services:
  # ============================================
  # INFRAESTRUTURA
  # ============================================

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: achadinhos-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: achadinhos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d achadinhos"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: achadinhos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # APLICAÇÃO
  # ============================================

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: achadinhos-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      # Porta 8000 do host fica ocupada por outro projeto nesta máquina —
      # a API continua na 8000 dentro do container, só o mapeamento externo muda.
      - "8010:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://root:password@postgres:5432/achadinhos
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: achadinhos-bot
    command: python -m bot.main_bot
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://root:password@postgres:5432/achadinhos
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # O bot não expõe porta HTTP — checa o heartbeat que ele mesmo grava
      # no Redis a cada ciclo do pipeline (ver bot/dedup.py HEARTBEAT_KEY).
      test: ["CMD", "python", "-c", "import os, sys, redis; sys.exit(0 if redis.from_url(os.environ['REDIS_URL']).exists('achadinhos:bot:last_run') else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
