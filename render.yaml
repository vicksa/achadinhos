services:
  - type: web
    name: achadinhos-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python -m core.bootstrap_db && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: PUBLIC_BASE_URL
        value: https://achadinhos-api-4by9.onrender.com
      - key: FRONTEND_URL
        value: https://achadinhos-web-c74w.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: achadinhos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: achadinhos-kv
          type: keyvalue
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: AFFILIATE_REQUIRE_MONETIZABLE
        value: "true"
      - key: TEMU_AFFILIATE_URL
        value: https://temu.to/k/gjj9tmr3rdo
      - key: TEMU_AFFILIATE_CODE
        value: alp663569
      - key: MAGALU_AFFILIATE_URL
        value: https://www.magazinevoce.com.br/magazinedescontovipi/

  - type: web
    name: achadinhos-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://achadinhos-api-4by9.onrender.com

  - type: keyvalue
    name: achadinhos-kv
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: achadinhos-db
    plan: free
    region: oregon
