services:
  - type: web
    name: achadinhos-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: AFFILIATE_REQUIRE_MONETIZABLE
        value: "true"
    dockerCommand: sh -c 'python -m core.bootstrap_db && uvicorn api.main:app --host 0.0.0.0 --port $PORT'
